[build]
  command = "NEXT_DISABLE_ESLINT=1 npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Редіректи для API запитів до вашого бекенду
[[redirects]]
  from = "/api/*"
  to = "${NEXT_PUBLIC_API_URL}/api/:splat"
  status = 200
  force = true

# Альтернативний редірект тільки для аналітики (якщо бекенд на іншому домені)
